<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>Pizarrón SQDCE Corasa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: tablero físico SQDCE llevado a pantalla — 5 pilares en columnas × 4 niveles en filas; legible en proyector (vista 1280×720). */
:root{
  --navy:#021632; --panel:#0A2348; --panel-2:#10305C; --line:#22446F;
  --fg:#EEF3FA; --muted:#93A6C2; --accent:#FE5000; --accent-soft:#FE500022;
  --ok:#2BC48A; --bad:#FF4D5E; --warn:#F5B82E; --nodata:#16294A;
  --display:"Montserrat",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Jost","Segoe UI",system-ui,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:18px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px}
.steps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.steps button{background:none;border:1px solid transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted);font-family:var(--display);font-weight:600}
.steps button[aria-current="step"]{color:var(--fg);border-color:var(--line);background:var(--panel)}
.steps button:disabled{opacity:.4;cursor:default}
.proto{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--navy);background:var(--warn);padding:5px 10px;border-radius:4px;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;padding-block:16px;min-height:0}
section.stage{flex:1;display:flex;flex-direction:column;gap:14px}
section.stage.enter{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1.1}
h2{font-size:clamp(20px,2.2vw,26px);font-weight:700}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--muted);max-width:62ch;margin:0}
.btn{background:var(--accent);border:0;border-radius:8px;padding:11px 20px;font-family:var(--display);font-weight:700;font-size:15px;color:#fff}
.btn:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex-wrap:wrap}
footer .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);vertical-align:middle;margin-left:6px}
footer .dot.live{background:var(--ok)} footer .dot.canned{background:var(--warn)}

/* Aviso */
.intro{margin:auto;max-width:780px;display:flex;flex-direction:column;gap:16px;padding-block:16px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.levels div{border-top:2px solid var(--accent);padding-top:8px;color:var(--muted);font-size:14px}
.levels strong{display:block;color:var(--fg);font-family:var(--display);font-size:14px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px;font-family:var(--display);font-weight:600}
.flow span{border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.flow em{font-style:normal;color:var(--line)}

/* Datos */
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;transition:border-color .2s,background .2s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.slot{background:var(--panel);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:flex-start;min-width:0;border:1px solid transparent;transition:border-color .3s}
.slot.ok{border-color:var(--ok)}
.glyph{flex:none;width:42px;height:52px;border-radius:4px 14px 4px 4px;background:#5B6B84;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:11px}
.glyph.x{background:#1D6F42}
.slot h3{font-size:15px} .slot p{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.slot .st{margin-top:6px;font-size:12px;font-family:var(--display);font-weight:600;color:var(--muted)}
.slot.ok .st{color:var(--ok)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
.proc{margin:auto;display:flex;flex-direction:column;gap:12px;min-width:min(440px,100%);padding:0}
.proc li{list-style:none;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:18px}
.proc li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.proc li.on{color:var(--fg)} .proc li.on::before{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.proc li.done{color:var(--fg)} .proc li.done::before{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tablero 5 × 4 */
.boardhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.stats b{color:var(--fg);font-family:var(--display)}
.gridwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:92px repeat(5,minmax(170px,1fr));gap:6px;min-width:960px;padding-top:10px}
.lvl{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 8px;border-radius:8px;background:var(--panel-2)}
.lvl b{font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent);line-height:1}
.lvl span{font-size:11px;color:var(--muted);line-height:1.2;font-family:var(--display);font-weight:600}
.ph{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);text-align:left;position:relative}
.ph[data-s="bad"]{border-color:var(--bad)}
.letter{width:38px;height:38px;flex:none;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy)}
[data-s="ok"] .letter{background:var(--ok)} [data-s="bad"] .letter{background:var(--bad);color:#fff}
.ph .nm{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.1}
.ph .vv{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.ph .mm{font-size:11px;color:var(--muted)}
.flag{position:absolute;top:-9px;right:8px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px}
.flag.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #FE500088}60%{box-shadow:0 0 0 8px #FE500000}}
.cell{background:var(--panel);border-radius:8px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:4px;border:1px solid transparent;cursor:pointer;text-align:left}
.cell:hover{border-color:var(--line)}
.cell .cap{font-size:11px;color:var(--muted)}
.mcal{display:grid;grid-template-columns:repeat(7,11px);gap:2px;flex:none}
.mcal i{width:11px;height:11px;border-radius:2px;background:var(--nodata);display:block}
.mcal i.ok{background:var(--ok)} .mcal i.bad{background:var(--bad)} .mcal i.fut{background:transparent;border:1px solid var(--line)} .mcal i.blank{background:transparent}
.mcal i.today{outline:2px solid var(--fg);outline-offset:1px}
.n1{display:flex;gap:10px;align-items:center}
.n1 .hits{font-size:12px;color:var(--muted);line-height:1.25}
.n1 .hits b{display:block;font-family:var(--display);font-size:18px;color:var(--fg)}
.cell svg{width:100%;height:58px;display:block}
.mp{display:flex;flex-direction:column;gap:3px}
.mp div{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:11px}
.mp .t{position:relative;height:16px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.mp .t span{position:absolute;inset:0 auto 0 0;background:var(--muted);opacity:.5}
.mp .t span.v{background:var(--accent);opacity:1}
.mp .t label{position:absolute;left:5px;top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;right:4px;line-height:16px}
.mp b{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right}
.chipsrow{display:flex;gap:4px;flex-wrap:wrap}
.st{font-family:var(--display);font-weight:700;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel-2);white-space:nowrap}
.st.Completado{background:#2BC48A33;color:var(--ok)} .st.En{background:#4C8DFF33;color:#8DB6FF} .st.Programado{background:var(--panel-2);color:var(--muted)}
.st.Vencida{background:var(--bad);color:#fff} .st.IA{background:var(--accent);color:#fff}
.cell .act{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Detalle de pilar */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px 5px 5px;font-family:var(--display);font-weight:700;font-size:14px}
.tabs button .letter{width:28px;height:28px;font-size:15px;border-radius:5px}
.tabs button[aria-selected="true"]{border-color:var(--fg);background:var(--panel-2)}
.signal{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FE500014;border:1px solid var(--accent);border-radius:10px;padding:10px 14px}
.signal b.t{font-family:var(--display)}
.chip{font-family:var(--display);font-weight:700;font-size:15px;padding:2px 8px;border-radius:5px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.chip.hot{background:var(--bad);color:#fff}
.quad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quad .n4{grid-column:1/-1}
.n4body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px;align-items:start}
.n4body.solo{grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card .hd .lv{font-family:var(--display);font-weight:800;color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.card .hd h3{font-size:16px}
.card svg{width:100%;height:auto;display:block}
.bigcal{display:grid;grid-template-columns:repeat(7,26px);gap:3px}
.bigcal .dw{font-size:10px;color:var(--muted);text-align:center;font-family:var(--display);font-weight:600}
.bigcal i{height:22px;border-radius:4px;background:var(--nodata);display:grid;place-items:center;font-style:normal;font-size:12px;font-family:var(--display);font-weight:700;color:#fff8}
.bigcal i.ok{background:var(--ok);color:var(--navy)} .bigcal i.bad{background:var(--bad);color:#fff}
.bigcal i.fut{background:transparent;border:1px solid var(--line);color:var(--muted)} .bigcal i.blank{background:transparent}
.bigcal i.today{outline:3px solid var(--fg);outline-offset:1px}
.n1big{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.n1big .kv{display:flex;flex-direction:column;gap:3px;min-width:0}
.n1big .kv .km{color:var(--muted);font-size:13px}
.n1big .kv .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.n1big .kv .km{color:var(--muted);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 10px;font-size:12px;font-family:var(--display);font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid #22446F80;vertical-align:top}
.tbl td.f{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.ia td{background:#FE50000F}
.prop{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#FE50000D}
.prop .lbl{font-size:11px;color:var(--muted);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.prop textarea,.prop input{width:100%;background:var(--navy);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);font:inherit;font-size:14px;resize:vertical}
.prop textarea[readonly],.prop input[readonly]{border-color:transparent;background:transparent;padding-inline:0}
.prop .two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
.prop .btn{padding:7px 14px;font-size:13px}

/* Despliegue y ruta de madurez */
.tiers{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--muted)}
.tiers span b{color:var(--fg);font-family:var(--display);font-size:12px;margin-right:6px}
.tiers span.me b{color:var(--accent)}
.ruta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;min-height:280px}
.paso{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:var(--h);display:flex;flex-direction:column;gap:6px}
.paso b{font-family:var(--display);font-size:30px;font-weight:800;color:var(--muted);line-height:1}
.paso h3{font-size:16px} .paso p{margin:0;font-size:14px;color:var(--muted)}
.paso.ia{border-color:var(--accent);background:#FE500014} .paso.ia b{color:var(--accent)} .paso.ia p{color:var(--fg)}
.cta{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;flex-wrap:wrap}
.cta img{width:120px;height:120px;border-radius:8px;background:#fff;padding:6px;flex:none}
.cta div{min-width:0;flex:1}
@media (max-width:900px){.ruta{grid-template-columns:minmax(0,1fr)}.paso{min-height:0}}
/* Causas */
.ask{display:flex;gap:10px;flex-wrap:wrap}
.ask input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--fg);font:inherit;font-size:18px}
#ai{display:flex;flex-direction:column;gap:12px}
.m4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:140px}
.m h3{font-size:16px;display:flex;align-items:center;gap:8px}
.m h3::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent)}
.m .body{font-size:15px} .m .body p{margin:0 0 6px} .m .body ul{margin:0;padding-left:18px} .m .body li{margin-bottom:6px}
.m .body em{color:var(--muted);font-style:normal}
.thinking{color:var(--muted);font-size:15px;display:flex;gap:10px;align-items:center}
.thinking::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.disclaimer{border-left:3px solid var(--accent);padding:8px 14px;background:var(--panel);font-family:var(--display);font-weight:600;font-size:15px}
.free{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
.free p{margin:0 0 6px}.free ul{margin:0 0 6px;padding-left:20px}
.q{font-family:var(--display);font-weight:600;color:var(--muted);font-size:13px;margin-bottom:4px}

@media (max-width:1000px){.quad{grid-template-columns:minmax(0,1fr)}.n4body{grid-template-columns:minmax(0,1fr)}.m4{grid-template-columns:repeat(2,minmax(0,1fr))}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.drop{grid-template-columns:minmax(0,1fr)}.m4{grid-template-columns:minmax(0,1fr)}.steps{margin-left:0}.prop .two{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app">
  <header>
    <div class="brand"><b>COR<i>A</i>SA</b><span>Planta Demo · Postes troncocónicos galvanizados</span></div>
    <nav class="steps" id="steps" aria-label="Pasos de la demo"></nav>
    <div class="proto">PROTOTIPO · DATOS FICTICIOS</div>
  </header>
  <main id="main"></main>
  <footer><span>Prototipo TalentoIA · No conectado a ningún sistema de planta</span><span>Corasa es una empresa ficticia<span class="dot" id="aidot"></span></span></footer>
</div>
<input type="file" id="picker" multiple accept=".xlsx,.xls,.txt" hidden>

/* ---------- lectura ---------- */
const num = v => typeof v === "number" ? v : Number(String(v ?? "").replace(/[^0-9.\-]/g,"")) || 0;
function normDate(v){
  if (v instanceof Date) return iso(v);
  if (typeof v === "number" && window.XLSX){ const p = XLSX.SSF.parse_date_code(v); return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
  const s = String(v).trim(); let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m){ const y = m[3].length===2 ? "20"+m[3] : m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return s;
}
const NUMCOLS = ["Seg_Plan","Seg_Real","Kg_Procesados","Horas_Extra","Incidentes","Casi_Accidentes","Auditoria_5S","Kg","Costo_MXN","Horas"];
const DATECOLS = ["Fecha","Fecha_Compromiso"];
function clean(rows){ return rows.map(r=>{ const o={}; for (const k in r){ const kk = k.trim();
  o[kk] = DATECOLS.includes(kk) ? normDate(r[k]) : NUMCOLS.includes(kk) ? num(r[k]) : String(r[k]).trim(); } return o; }); }
const SHEETS = ["Produccion","Eventos_Seguridad","Paros","Hallazgos_5S","Acciones","Scrap"];
async function readFile(f){
  const name = f.name.toLowerCase();
  if (name.endsWith(".txt")) return {kind:"notas", sheets:{notas: await f.text()}, name:f.name};
  if (!window.XLSX) throw new Error("No se pudo cargar el lector de Excel. Usa los archivos de ejemplo.");
  const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
  const sheets = {};
  wb.SheetNames.forEach(sn=>{ const key = SHEETS.find(s=>s.toLowerCase()===sn.trim().toLowerCase().replace(/\s+/g,"_"));
    if (key) sheets[key] = clean(XLSX.utils.sheet_to_json(wb.Sheets[sn], {raw:true, defval:""})); });
  if (sheets.Produccion) return {kind:"prod", sheets, name:f.name};
  if (sheets.Scrap) return {kind:"scrap", sheets, name:f.name};
  throw new Error(f.name+": no encontré las hojas esperadas (Produccion o Scrap).");
}
async function takeFiles(list){
  S.err = null;
  for (const f of list){
    try { const r = await readFile(f); Object.assign(S.raw, r.sheets);
      const n = r.kind==="notas" ? r.sheets.notas.split("\n").filter(l=>l.trim()).length+" líneas"
        : Object.entries(r.sheets).map(([k,v])=>v.length).reduce((a,b)=>a+b,0)+" registros en "+Object.keys(r.sheets).length+" hoja"+(Object.keys(r.sheets).length>1?"s":"");
      S.files[r.kind] = {name:r.name, info:n}; }

}

/* ---------- modelo SQDCE ---------- */
const sum = (a,f) => a.reduce((s,r)=>s+f(r),0);
function groupSum(rows, key, val){ const m = {}; rows.forEach(r=>{ m[r[key]] = (m[r[key]]||0) + (val ? r[val] : 1); });
  const tot = Object.values(m).reduce((a,b)=>a+b,0)||1; let cum = 0;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{ cum += v; return {k, v, share:v/tot, cum:cum/tot}; }); }
function build(){
  const P = S.raw.Produccion, X = S.raw.Scrap || [], EV = S.raw.Eventos_Seguridad || [], PA = S.raw.Paros || [], H5 = S.raw.Hallazgos_5S || [], AC = S.raw.Acciones || [];
  const days = [...new Set(P.map(r=>r.Fecha))].sort(), lines = [...new Set(P.map(r=>r.Linea))].sort();
  const last = days.length-1, lastDay = days[last];
  const by = d => P.filter(r=>r.Fecha===d), sc = d => X.filter(r=>r.Fecha===d);
  const ser = {
    S: days.map(d=>sum(by(d),r=>r.Incidentes)),
    casi: days.map(d=>sum(by(d),r=>r.Casi_Accidentes)),
    Q: days.map(d=>sum(sc(d),r=>r.Kg)/sum(by(d),r=>r.Kg_Procesados)*100),
    D: days.map(d=>sum(by(d),r=>r.Seg_Real)/sum(by(d),r=>r.Seg_Plan)*100),
    C: days.map(d=>sum(sc(d),r=>r.Costo_MXN)),
    E: days.map(d=>sum(by(d),r=>r.Auditoria_5S)/by(d).length),
  };
  const lineQ = {}; lines.forEach(l=>{ lineQ[l] = days.map(d=>{ const kg = sum(P.filter(r=>r.Fecha===d&&r.Linea===l),r=>r.Kg_Procesados);
    return kg ? sum(X.filter(r=>r.Fecha===d&&r.Linea===l),r=>r.Kg)/kg*100 : 0; }); });
  // señal en calidad: 3 alzas seguidas en una línea, último valor sobre meta
  let signal = null;
  lines.forEach(l=>{ const s = lineQ[l]; if (s.length<4) return;
    if (s[last]>s[last-1] && s[last-1]>s[last-2] && s[last-2]>s[last-3] && s[last]>CONF.Q.meta && (!signal || s[last]>signal.vals[3])){
      const rows = X.filter(r=>r.Linea===l && days.slice(-3).includes(r.Fecha));
      const top = groupSum(rows.map(r=>({...r, k2:r.Etapa+"|"+r.Defecto})), "k2", "Kg").map(t=>({etapa:t.k.split("|")[0], defecto:t.k.split("|")[1], kg:t.v, share:t.share}));
      signal = {line:l, vals:s.slice(-4), days:days.slice(-4), top, kg:sum(rows,r=>r.Kg), costo:sum(rows,r=>r.Costo_MXN)};
    }});
  const acts = AC.map(a=>({...a, venc: a.Estatus!=="Completado" && a.Fecha_Compromiso < lastDay}));
  const lastInc = EV.filter(e=>/incidente/i.test(e.Tipo) && !/casi/i.test(e.Tipo)).map(e=>e.Fecha).sort().pop();
  const sinInc = lastInc ? Math.round((pd(lastDay)-pd(lastInc))/86400000) : null;
  return {days, lines, last, lastDay, ser, lineQ, signal, acts, sinInc, P, X, EV, PA, H5,
    nRec: P.length+X.length+EV.length+PA.length+H5.length+AC.length,
    hx: sum(by(lastDay),r=>r.Horas_Extra), lineD: Object.fromEntries(lines.map(l=>{ const r=P.find(r=>r.Fecha===lastDay&&r.Linea===l); return [l, r?r.Seg_Real+"/"+r.Seg_Plan:""]; }))};
}

function vUpload(){
  const ready = S.files.prod && S.files.scrap && S.files.notas;
  return `<section class="stage">
    <div><div class="eyebrow">Fin de turno · ${S.raw.Produccion?"":"viernes 23 de octubre"}</div><h2>Así llegan los datos del turno</h2>
    <p class="sub">El Excel de producción (con seguridad, paros, 5S y acciones), el registro de scrap y las notas que dejó el supervisor.</p></div>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Soltar o elegir archivos">
      ${slot("prod","Producción del turno","XLSX","x")}${slot("scrap","Registro de scrap","XLSX","x")}${slot("notas","Notas del supervisor","TXT","")}
    </div>
    ${S.err?`<p style="color:var(--bad);margin:0">${esc(S.err)}</p>`:""}
    <div class="row"><button class="btn" id="buildBtn" ${ready?"":"disabled"}>Armar tablero</button>
    <button class="btn ghost" id="pickBtn">Elegir archivos</button><button class="linkish" id="demoBtn">usar archivos de ejemplo</button></div>
  </section>`;
}
function vProcessing(){ return `<section class="stage"><ul class="proc" id="proc">
  <li>Leyendo producción, scrap, seguridad, paros y notas</li><li>Nivel 1 · Comparando cada día contra su meta</li><li>Nivel 2 · Calculando tendencias del mes</li><li>Nivel 3 · Armando los Pareto de causas</li><li>Nivel 4 · Revisando acciones y buscando patrones</li></ul></section>`; }
function vBoard(){
  const m = S.model;
  const flags = k => { const v = pillarActs(k,m).filter(a=>a.venc).length; const sig = k==="Q" && m.signal;
    return sig ? `<span class="flag pulse">1 señal</span>` : v ? `<span class="flag">${v} vencida${v>1?"s":""}</span>` : ""; };
  const head = k => { const c = CONF[k]; const s = todayOk(k,m)?"ok":"bad";
    return `<button class="ph" data-s="${s}" data-pill="${k}">${flags(k)}<div class="letter">${k}</div><div style="min-width:0"><div class="nm">${c.name}</div><div class="vv">${c.fmt(m.ser[k][m.last])}</div><div class="mm">${c.kpi} · ${c.metaTxt.replace("Meta: ","meta ")}</div></div></button>`; };
  const extraN1 = k => k==="S" && m.sinInc!=null ? `<span>${m.sinInc} días sin incidente</span>` : "";
  const cellN1 = k => `<button class="cell" data-pill="${k}"><div class="n1">${miniCal(k,m)}<div class="hits"><b>${hits(k,m)}/${m.days.length}</b>días en meta${extraN1(k)?"<br>"+extraN1(k):""}</div></div></button>`;
  const cellN2 = k => `<button class="cell" data-pill="${k}">${trend(m.ser[k], k)}<div class="cap">${m.days.length} días · línea punteada = meta</div></button>`;
  const cellN3 = k => `<button class="cell" data-pill="${k}">${miniPareto(CONF[k].pareto(m, r=>true))}</button>`;
  const cellN4 = k => { const list = pillarActs(k,m); const top = list.find(a=>a.venc) || list.find(a=>a.Estatus!=="Completado");
    return `<button class="cell" data-pill="${k}"><div class="chipsrow">${actCounts(list)}</div>${top?`<div class="act">${esc(top.Accion)}</div><div class="cap">${esc(top.Responsable)} · ${dShort(top.Fecha_Compromiso)}</div>`:`<div class="cap">Sin acciones abiertas</div>`}</button>`; };
  const lvl = (n,t) => `<div class="lvl"><b>${n}</b><span>${t}</span></div>`;
  return `<section class="stage">
    <div class="boardhead"><div><div class="eyebrow">Tablero SQDCE · ${dLong(m.lastDay)} · mes a la fecha</div><h2>El tablero se armó solo</h2></div>
    <div class="stats"><span><b>${S.buildMs}</b> s</span><span><b>${fmt(m.nRec)}</b> registros leídos</span><span><b>20</b> gráficos</span><span><b>0</b> capturas manuales</span></div></div>
    <div class="gridwrap"><div class="grid">
      <div></div>${PIL.map(head).join("")}
      ${lvl(1,"Diario vs meta")}${PIL.map(cellN1).join("")}
      ${lvl(2,"Tendencia")}${PIL.map(cellN2).join("")}
      ${lvl(3,"Pareto de causas")}${PIL.map(cellN3).join("")}
      ${lvl(4,"Acciones correctivas")}${PIL.map(cellN4).join("")}
    </div></div>
    ${m.signal?`<div class="row"><button class="btn" data-pill="Q">Ver señal en Calidad</button><span class="sub" style="font-size:14px">El agente encontró un patrón en ${m.signal.line} y ${m.acts.filter(a=>a.venc).length} acciones vencidas.</span></div>`:""}
  </section>`;
}
function vPillar(){
  const m = S.model, k = S.pillar, c = CONF[k], sig = k==="Q" ? m.signal : null;
  if (sig && !S.proposal) S.proposal = proposeAction(sig, m);
  const tabs = `<div class="tabs" role="tablist">${PIL.map(p=>`<button role="tab" aria-selected="${p===k}" data-pill="${p}" data-s="${todayOk(p,m)?"ok":"bad"}"><span class="letter">${p}</span>${CONF[p].name}</button>`).join("")}</div>`;
  const banner = sig ? `<div class="signal"><span class="eyebrow">Señal del agente</span><b class="t">${sig.line}: scrap tres días seguidos al alza</b>
    <span class="row" style="gap:4px">${sig.vals.map((v,i)=>`<span class="chip ${i?"hot":""}">${fmt(v,1)}%</span>`).join("<span style='color:var(--muted)'>→</span>")}</span>
    <span style="font-size:14px">${fmt(sig.top[0].share*100)}% viene de ${esc(sig.top[0].etapa)}: ${esc(sig.top[0].defecto.toLowerCase())}.</span></div>` : "";
  const extra = k==="S" ? `<div class="km">${m.sinInc} días sin incidente · ${m.ser.casi[m.last]} casi accidente${m.ser.casi[m.last]===1?"":"s"} hoy</div>`
    : k==="D" ? `<div class="km">Segmentos hoy: ${m.lines.map(l=>l+" "+m.lineD[l]).join(" · ")}</div>`
    : k==="C" ? `<div class="km">Horas extra hoy: ${m.hx}</div>` : "";
  const n1 = `<div class="card"><div class="hd"><span class="lv">Nivel 1 · Diario vs meta</span><span class="sub" style="font-size:12px">${MESES[pd(m.lastDay).getMonth()]} ${pd(m.lastDay).getFullYear()}</span></div>
    <div class="n1big">${bigCal(k,m)}<div class="kv"><span class="km">${c.kpi} · hoy</span><span class="v" style="color:${todayOk(k,m)?"var(--ok)":"var(--bad)"}">${c.fmt(m.ser[k][m.last])}</span><span class="km">${c.metaTxt}</span><span class="km"><b style="color:var(--fg)">${hits(k,m)} de ${m.days.length}</b> días en meta</span>${extra}</div></div></div>`;
  const n2 = `<div class="card"><div class="hd"><span class="lv">Nivel 2 · Tendencia</span><h3>${k==="Q"?"Scrap por línea":c.kpi+" · planta"}</h3></div>
    ${k==="Q" ? lineChart(m)+`<div class="legend">${m.lines.map(l=>`<span><i style="background:${l===m.signal?.line?"var(--accent)":"var(--muted)"}"></i>${l}</span>`).join("")}<span><i style="background:var(--fg)"></i>Meta</span></div>`
      : trend(m.ser[k], k, {axis:true, w:420, h:230, labels:m.days})+`<div class="legend"><span><i style="background:var(--ok)"></i>En meta</span><span><i style="background:var(--bad)"></i>Fuera de meta</span><span><i style="background:var(--fg)"></i>Meta</span></div>`}</div>`;
  const items = c.pareto(m, periodFilter(m));
  const vital = items.filter((it,i)=>isVital(items,i)).map(it=>it.k);
  const n3 = `<div class="card"><div class="hd"><span class="lv">Nivel 3 · Pareto de causas</span>
    <div class="seg" role="group" aria-label="Periodo"><button data-period="mes" aria-pressed="${S.period==="mes"}">Mes</button><button data-period="7d" aria-pressed="${S.period==="7d"}">Últimos 7 días</button></div></div>
    <h3 style="font-size:14px;font-weight:600;color:var(--muted)">${c.ptitle}</h3>${paretoChart(items, c.punit)}
    ${items.length?`<div class="cap" style="font-size:12px;color:var(--muted)">Pocas vitales: <b style="color:var(--fg)">${vital.map(esc).join(", ")}</b> (${fmt((items[vital.length-1]?.cum||0)*100)}% del total)</div>`:""}</div>`;
  const list = pillarActs(k,m);
  const prop = sig && !S.approved ? `<div class="prop"><div class="row" style="justify-content:space-between"><span class="lbl">Acción propuesta por el agente</span><span class="st Programado">Pendiente de revisión</span></div>
    <textarea id="aQue" rows="3" ${S.editing?"":"readonly"} aria-label="Qué">${esc(S.proposal.que)}</textarea>
    <div class="two"><div><div class="lbl">Responsable</div><input id="aQuien" value="${esc(S.proposal.quien)}" ${S.editing?"":"readonly"}></div><div><div class="lbl">Fecha compromiso</div><input id="aCuando" value="${esc(S.proposal.cuando)}" ${S.editing?"":"readonly"}></div></div>
    <div class="row"><button class="btn" id="approve">Aprobar</button><button class="btn ghost" id="edit">${S.editing?"Guardar cambios":"Editar"}</button></div></div>` : "";
  const n4 = `<div class="card n4"><div class="hd"><span class="lv">Nivel 4 · Acciones correctivas</span><div class="chipsrow">${actCounts(list)}</div></div><div class="n4body ${prop?"":"solo"}">${prop}
    <div class="tbl"><table><thead><tr><th>Acción</th><th>Responsable</th><th>Fecha</th><th>Estatus</th></tr></thead><tbody>
    ${list.map(a=>`<tr class="${a.ia?"ia":""}"><td>${a.ia?'<span class="st IA">IA</span> ':""}${esc(a.Accion)}</td><td>${esc(a.Responsable)}</td><td class="f">${dShort(a.Fecha_Compromiso)}</td><td>${stChip(a)}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;
  return `<section class="stage">
    <div class="row" style="justify-content:space-between">${tabs}${k==="Q"?`<button class="btn ${S.approved?"":"ghost"}" data-go="4">¿Cuál puede ser la causa? →</button>`:""}</div>
    <div class="tiers"><span class="eyebrow" style="color:var(--muted)">Despliegue del indicador</span>${["Línea · este tablero","Planta","Dirección"].map((n,i)=>`<span class="${i?"":"me"}"><b>${n}</b>${esc(c.tiers[i])}</span>`).join("")}</div>
    ${banner}<div class="quad">${n1}${n2}${n3}${n4}</div></section>`;
}
const RUTA = [
  {n:1, t:"Visible", d:"Los indicadores SQDCE están en el área, cada uno con su meta, y se actualizan al cierre de cada turno."},
  {n:2, t:"Revisión diaria", d:"El tablero se revisa todos los días: verde o rojo contra la meta, Pareto de causas y acciones con responsable y fecha."},
  {n:3, t:"Escalamiento", d:"Lo que la línea no resuelve sube al tablero de planta. La causa raíz se valida en piso y la meta mejora cada pocas semanas."},
  {n:4, t:"Forma de dirigir", d:"El tablero es cómo se maneja el negocio: cualquiera distingue lo normal de lo anormal y la respuesta tiene un estándar."},
  {n:5, t:"Asistido por IA", d:"Los datos llegan solos, el tablero se arma cada turno, el agente señala patrones y propone acciones. El supervisor dedica su tiempo a mejorar.", ia:true},
];
function vMaturity(){
  return `<section class="stage">
    <div><div class="eyebrow">Ruta de madurez SQDCE · TalentoIA</div><h2>¿En qué nivel está el tablero de su planta?</h2>
    <p class="sub">El tablero no es el objetivo. Es la forma de ver la operación, decidir rápido y mejorar. La IA no reemplaza los primeros niveles: los acelera.</p></div>
    <div class="ruta">${RUTA.map(r=>`<div class="paso ${r.ia?"ia":""}" style="--h:${40+r.n*12}%"><b>${r.n}</b><h3>${r.t}</h3><p>${r.d}</p></div>`).join("")}</div>
    <div class="cta"><img src="${QR}" alt="Código QR de la autoevaluación MIA-360"><div><div class="eyebrow">Autoevaluación MIA-360 · TalentoIA</div>
    <h3>Su punto de partida en IA, en 35 preguntas</h3><p class="sub">Contéstenla con su equipo directivo. Si no pueden demostrar que algo funciona, elijan el nivel de abajo.</p></div></div>
  </section>`;
}
function vCause(){
  return `<section class="stage">
    <div><div class="eyebrow">Pregunta del supervisor · ${S.model.signal?.line||""}</div><h2>¿Cuál puede ser la causa?</h2></div>
    <form class="ask" id="askForm"><input id="askIn" value="¿Cuál puede ser la causa del scrap en ${S.model.signal?.line||"la línea"}?" aria-label="Pregunta al agente"><button class="btn">Preguntar</button></form>
    <div id="ai"></div><div class="row" style="margin-top:auto;justify-content:flex-end"><button class="btn ghost" data-go="5">Ruta de madurez SQDCE →</button></div></section>`;
}
function paintAI(){
  const box = $("#ai"); if (!box) return;
  const {res, tail} = split4(S.aiRaw); let h = "";
  if (!S.aiBusy && !S.aiRaw) h = `<p class="sub">El agente responde desde cuatro ángulos: método, máquina, material y mano de obra.</p>`;
  else {
    if (S.aiBusy && !S.aiRaw) h += `<div class="thinking">El agente está revisando los datos y las notas del turno…</div>`;
    h += `<div class="m4">${SECS.map(s=>`<div class="m"><h3>${s}</h3><div class="body">${res[s]?md(res[s]):(S.aiRaw?"…":"")}</div></div>`).join("")}</div>`;
    if (!S.aiBusy && S.aiRaw) h += `<div class="disclaimer">${esc(tail.replace(/^[#\s]+/,"") || "Son hipótesis para verificar en piso, no conclusiones.")}</div>`;
  }
  S.followups.forEach(f=>{ h += `<div class="free"><div class="q">${esc(f.q)}</div>${f.a?md(f.a):'<div class="thinking">Pensando…</div>'}</div>`; });
  box.innerHTML = h; $("#aidot").className = "dot "+(S.aiSource||"");
}
async function runBuild(){
  S.step = 1.5; render(); const t0 = performance.now(); const lis = [...document.querySelectorAll("#proc li")];
  for (let i=0;i<lis.length;i++){ lis[i].className="on"; if (i===1){ try { S.model = build(); } catch(e){ S.err = "No pude armar el tablero: "+e.message; S.step=1; render(); return; } }
    await new Promise(r=>setTimeout(r, 320)); lis[i].className="done"; }
  S.buildMs = fmt((performance.now()-t0)/1000,1); S.proposal=null; S.approved=false; S.step=2; render();
}
function render(){
  nav();
  const v = S.step===0?vIntro():S.step===1?vUpload():S.step===1.5?vProcessing():S.step===2?vBoard():S.step===3?vPillar():S.step===4?vCause():vMaturity();
  $("#main").innerHTML = v; if (S.step!==S.prevStep){ $("#main section")?.classList.add("enter"); S.prevStep=S.step; }
  wire(); if (S.step===4) paintAI();
}
function saveProp(){ if(!$("#aQue")) return; S.proposal = {que:$("#aQue").value, quien:$("#aQuien").value, cuando:$("#aCuando").value}; }
function wire(){
  const drop = $("#drop");
  if (drop){
    drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});
    drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
    drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");takeFiles([...e.dataTransfer.files]);});
    drop.addEventListener("click",()=>$("#picker").click());
    drop.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#picker").click();} });
  }
  $("#pickBtn")?.addEventListener("click",()=>$("#picker").click());
  $("#demoBtn")?.addEventListener("click",useDemo);
  $("#buildBtn")?.addEventListener("click",runBuild);
  $("#approve")?.addEventListener("click",()=>{ saveProp(); S.approved=true; S.editing=false; render(); });
  $("#edit")?.addEventListener("click",()=>{ if(S.editing) saveProp(); S.editing=!S.editing; render(); if(S.editing) $("#aQue").focus(); });
  $("#askForm")?.addEventListener("submit",e=>{ e.preventDefault(); const q=$("#askIn").value.trim(); if(!q) return;
    if (!S.aiRaw && !S.aiBusy) askCause(q); else if (!S.aiBusy) askFree(q); });
}
document.addEventListener("click",e=>{
  const p = e.target.closest("[data-pill]"); if (p){ go(3, p.dataset.pill); return; }
  const per = e.target.closest("[data-period]"); if (per){ S.period = per.dataset.period; render(); return; }
  const g = e.target.closest("[data-go]"); if (g && !g.disabled) go(Number(g.dataset.go));
});
$("#picker").addEventListener("change",e=>{ takeFiles([...e.target.files]); e.target.value=""; });
document.addEventListener("keydown",e=>{
  if (e.target.matches("input,textarea")) return;
  if (e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault();
    if (S.step===1){ if (S.files.prod&&S.files.scrap&&S.files.notas) runBuild(); }
    else if (S.step===2 && S.model){ go(3,"Q"); } else if (S.step<5) go(Math.floor(S.step)+1); }
  if (e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(Math.ceil(S.step)-1); }
  if (e.key==="r"||e.key==="R"){ Object.assign(S,{step:0,raw:{},files:{prod:null,scrap:null,notas:null},model:null,pillar:"Q",period:"mes",approved:false,editing:false,proposal:null,aiRaw:"",aiSource:null,aiBusy:false,followups:[],err:null}); clearInterval(typer); render(); }
  if ((e.key==="d"||e.key==="D") && S.step===1) useDemo();
  if (S.step===3 && "sqdceSQDCE".includes(e.key) && e.key.length===1) go(3, e.key.toUpperCase());
});
render();
</script>
</body></html>
